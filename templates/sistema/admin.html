<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel de Administración</title>
<style>
body { font-family: Arial; background: #f4f6f9; margin: 20px; }
h1 { color: #dc3545; }
.admin-container { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 20px; margin-top: 20px; }
.admin-box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
.admin-box h3 { margin-top: 0; color: #333; border-bottom: 2px solid #dc3545; padding-bottom: 10px; }
.usuario-item { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 6px; border-left: 4px solid #007bff; }
.usuario-item.viewer { border-left-color: #ffc107; }
.usuario-item.editor { border-left-color: #28a745; }
.usuario-item input, .usuario-item select { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
.btn { background: #007bff; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; margin: 2px; }
.btn:hover { background: #0056b3; }
.btn-success { background: #28a745; } .btn-success:hover { background: #1e7e34; }
.btn-danger { background: #dc3545; } .btn-danger:hover { background: #c82333; }
.btn-warning { background: #ffc107; color: #212529; } .btn-warning:hover { background: #e0a800; }
.new-user { background: #e8f5e8; border-left-color: #28a745; }
.log-item { background: #f8f9fa; padding: 10px; margin: 5px 0; border-radius: 4px; font-size: 0.9em; border-left: 3px solid #6c757d; }
.log-sistema { border-left-color: #dc3545; }
.log-bulevar { border-left-color: #007bff; }
.log-eden { border-left-color: #28a745; }
#logsContainer { max-height: 500px; overflow-y: auto; }
.role-badge { padding: 3px 8px; border-radius: 12px; font-size: 0.8em; font-weight: bold; }
.role-editor { background: #d4edda; color: #155724; }
.role-viewer { background: #fff3cd; color: #856404; }
.user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.contacto-item { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 6px; border-left: 4px solid #007bff; font-size: 0.9em; }
.contacto-item.nuevo { border-left-color: #28a745; background: #e8f5e8; }
.contacto-item.leido { border-left-color: #6c757d; }
.contacto-item.respondido { border-left-color: #ffc107; background: #fff3cd; }
.contacto-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.contacto-nombre { font-weight: bold; color: #333; }
.contacto-empresa { color: #6c757d; font-size: 0.8em; }
.contacto-fecha { color: #6c757d; font-size: 0.8em; }
.contacto-email { color: #007bff; font-size: 0.9em; margin: 5px 0; }
.contacto-servicio { background: #e3f2fd; color: #1976d2; padding: 2px 8px; border-radius: 12px; font-size: 0.8em; display: inline-block; margin: 5px 0; }
.contacto-mensaje { margin: 8px 0; padding: 8px; background: white; border-radius: 4px; border: 1px solid #dee2e6; }
.contacto-acciones { margin-top: 10px; }
.estado-badge { padding: 3px 8px; border-radius: 12px; font-size: 0.8em; font-weight: bold; }
.estado-nuevo { background: #d4edda; color: #155724; }
.estado-leido { background: #d1ecf1; color: #0c5460; }
.estado-respondido { background: #fff3cd; color: #856404; }
#contactosContainer { max-height: 600px; overflow-y: auto; }
</style>
</head>
<body>
<h1>🔧 Panel de Administración</h1>
<a href="/logout" style="float:right; color:#dc3545; text-decoration:none;">🚪 Cerrar sesión</a>

<div class="admin-container">
    <!-- Gestión de Usuarios -->
    <div class="admin-box">
        <h3>👥 Gestión de Usuarios</h3>
        <button class="btn btn-success" onclick="showAddUser()">➕ Agregar Usuario</button>
        <div id="usuariosContainer">
            <p>🔄 Cargando usuarios...</p>
        </div>
    </div>
    
    <!-- Log de Cambios -->
    <div class="admin-box">
        <h3>📋 Últimos Cambios</h3>
        <button class="btn" onclick="loadLogs()">🔄 Actualizar</button>
        <div id="logsContainer" style="margin-top: 15px;">
            <p>🔄 Cargando logs...</p>
        </div>
    </div>
    
    <!-- Mensajes de Contacto -->
    <div class="admin-box">
        <h3>📧 Mensajes de Contacto</h3>
        <button class="btn" onclick="loadContactos()">🔄 Actualizar</button>
        <div id="contactosContainer" style="margin-top: 15px;">
            <p>🔄 Cargando mensajes...</p>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
async function loadUsuarios() {
    try {
        console.log("🔄 Cargando usuarios...");
        const res = await fetch('/api/admin/clientes');
        console.log("📡 Respuesta:", res.status);
        
        if (!res.ok) {
            const errorText = await res.text();
            throw new Error(`Error ${res.status}: ${errorText}`);
        }
        
        const usuarios = await res.json();
        console.log("✅ Usuarios recibidos:", usuarios);
        
        if (!usuarios || usuarios.length === 0) {
            document.getElementById('usuariosContainer').innerHTML = '<p style="color:orange;">No hay usuarios configurados</p>';
            return;
        }
        
        let html = '';
        const clientes = {};
        
        // Agrupar por cliente
        usuarios.forEach(u => {
            if (!clientes[u.cliente]) clientes[u.cliente] = [];
            clientes[u.cliente].push(u);
        });
        
        Object.keys(clientes).forEach(cliente => {
            html += `<h4>🏢 ${cliente.toUpperCase()}</h4>`;
            clientes[cliente].forEach(usuario => {
                html += `
                    <div class="usuario-item ${usuario.rol}">
                        <div class="user-header">
                            <strong>${usuario.usuario}</strong>
                            <span class="role-badge role-${usuario.rol}">
                                ${usuario.rol === 'editor' ? '✏️ Editor' : '👁️ Viewer'}
                            </span>
                        </div>
                        <input type="text" value="${usuario.usuario}" readonly style="background:#f8f9fa;">
                        <input type="password" id="pass_${cliente}_${usuario.usuario}" value="${usuario.clave}" placeholder="Contraseña">
                        <select id="role_${cliente}_${usuario.usuario}">
                            <option value="editor" ${usuario.rol === 'editor' ? 'selected' : ''}>✏️ Editor</option>
                            <option value="viewer" ${usuario.rol === 'viewer' ? 'selected' : ''}>👁️ Viewer</option>
                        </select>
                        <div style="margin-top: 10px;">
                            <button class="btn btn-success" onclick="updateUsuario('${cliente}', '${usuario.usuario}')">💾 Guardar</button>
                            <button class="btn btn-danger" onclick="deleteUsuario('${cliente}', '${usuario.usuario}')">🗑️ Eliminar</button>
                        </div>
                    </div>
                `;
            });
        });
        
        document.getElementById('usuariosContainer').innerHTML = html;
        
    } catch(err) {
        console.error('Error:', err);
        document.getElementById('usuariosContainer').innerHTML = `<p style="color:red;">❌ Error: ${err.message}</p>`;
    }
}

async function loadLogs() {
    try {
        const res = await fetch('/api/admin/logs');
        
        if (!res.ok) {
            throw new Error(`Error ${res.status}`);
        }
        
        const logs = await res.json();
        
        let html = '';
        if (logs.length === 0) {
            html = '<p>No hay cambios registrados</p>';
        } else {
            logs.forEach(log => {
                const clienteClass = `log-${log.cliente.toLowerCase()}`;
                html += `
                    <div class="log-item ${clienteClass}">
                        <strong>${log.fecha}</strong> - 
                        <span style="color: #007bff;">[${log.cliente}]</span>
                        <strong>${log.usuario}</strong><br>
                        <em>${log.accion}</em>
                        ${log.detalle ? `<br><small style="color:#666;">${log.detalle}</small>` : ''}
                    </div>
                `;
            });
        }
        
        document.getElementById('logsContainer').innerHTML = html;
        
    } catch(err) {
        console.error('Error logs:', err);
        document.getElementById('logsContainer').innerHTML = `<p style="color:red;">❌ Error: ${err.message}</p>`;
    }
}

function showAddUser() {
    const html = `
        <div class="usuario-item new-user" id="newUserForm">
            <h5>➕ Nuevo Usuario</h5>
            <select id="newCliente">
                <option value="">Seleccionar cliente...</option>
                <option value="bulevar">🏢 Bulevar</option>
                <option value="eden">🏢 Eden</option>
            </select>
            <input type="text" id="newUsuario" placeholder="Nombre de usuario">
            <input type="password" id="newClave" placeholder="Contraseña">
            <select id="newRol">
                <option value="viewer">👁️ Viewer (Solo lectura)</option>
                <option value="editor">✏️ Editor (Puede editar)</option>
            </select>
            <div style="margin-top: 10px;">
                <button class="btn btn-success" onclick="addUsuario()">✅ Crear</button>
                <button class="btn btn-warning" onclick="cancelAddUser()">❌ Cancelar</button>
            </div>
        </div>
    `;
    
    document.getElementById('usuariosContainer').insertAdjacentHTML('afterbegin', html);
}

function cancelAddUser() {
    document.getElementById('newUserForm').remove();
}

async function addUsuario() {
    const cliente = document.getElementById('newCliente').value;
    const usuario = document.getElementById('newUsuario').value;
    const clave = document.getElementById('newClave').value;
    const rol = document.getElementById('newRol').value;
    
    if (!cliente || !usuario || !clave) {
        alert('Todos los campos son requeridos');
        return;
    }
    
    try {
        const res = await fetch('/api/admin/add_usuario', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({cliente, usuario, clave, rol})
        });
        
        if (res.ok) {
            alert(`✅ Usuario ${usuario} creado correctamente en ${cliente}`);
            loadUsuarios();
            loadLogs();
        } else {
            const error = await res.json();
            alert(`❌ Error: ${error.error}`);
        }
    } catch(err) {
        alert('❌ Error creando usuario');
    }
}

async function updateUsuario(cliente, usuario) {
    try {
        const clave = document.getElementById(`pass_${cliente}_${usuario}`).value;
        const rol = document.getElementById(`role_${cliente}_${usuario}`).value;
        
        if (!clave) {
            alert('La contraseña es requerida');
            return;
        }
        
        const res = await fetch('/api/admin/update_usuario', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({cliente, usuario, clave, rol})
        });
        
        if (res.ok) {
            alert(`✅ Usuario ${usuario} actualizado correctamente`);
            loadUsuarios();
            loadLogs();
        } else {
            alert('❌ Error actualizando usuario');
        }
        
    } catch(err) {
        alert('❌ Error actualizando usuario');
    }
}

async function deleteUsuario(cliente, usuario) {
    if (!confirm(`¿Eliminar "${usuario}" de ${cliente}?`)) return;
    
    try {
        const res = await fetch('/api/admin/delete_usuario', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({cliente, usuario})
        });
        
        if (res.ok) {
            alert(`✅ Usuario ${usuario} eliminado correctamente`);
            loadUsuarios();
            loadLogs();
        } else {
            alert('❌ Error eliminando usuario');
        }
    } catch(err) {
        alert('❌ Error eliminando usuario');
    }
}

// Funciones para mensajes de contacto
async function loadContactos() {
    try {
        console.log("🔄 Cargando contactos...");
        const res = await fetch('/api/admin/contactos');
        
        if (!res.ok) {
            throw new Error(`Error ${res.status}`);
        }
        
        const contactos = await res.json();
        console.log("📧 Contactos cargados:", contactos.length);
        
        let html = '';
        
        if (contactos.length === 0) {
            html = '<p style="color: #6c757d; text-align: center;">📭 No hay mensajes de contacto</p>';
        } else {
            contactos.forEach(contacto => {
                const estadoClass = contacto.Estado === 'Nuevo' ? 'nuevo' : 
                                  contacto.Estado === 'Leído' ? 'leido' : 'respondido';
                
                const estadoBadgeClass = contacto.Estado === 'Nuevo' ? 'estado-nuevo' : 
                                       contacto.Estado === 'Leído' ? 'estado-leido' : 'estado-respondido';
                
                html += `
                    <div class="contacto-item ${estadoClass}">
                        <div class="contacto-header">
                            <div>
                                <div class="contacto-nombre">${contacto.Nombre}</div>
                                ${contacto.Empresa !== 'No especificada' ? `<div class="contacto-empresa">${contacto.Empresa}</div>` : ''}
                            </div>
                            <div>
                                <span class="estado-badge ${estadoBadgeClass}">${contacto.Estado}</span>
                            </div>
                        </div>
                        
                        <div class="contacto-email">📧 ${contacto.Email}</div>
                        
                        ${contacto.Telefono !== 'No especificado' ? `<div style="color: #6c757d; font-size: 0.9em;">📞 ${contacto.Telefono}</div>` : ''}
                        
                        ${contacto.Servicio !== 'Consulta general' ? `<span class="contacto-servicio">${contacto.Servicio}</span>` : ''}
                        
                        <div class="contacto-mensaje">${contacto.Mensaje}</div>
                        
                        <div style="color: #6c757d; font-size: 0.8em; margin-top: 8px;">
                            📅 ${contacto.Fecha} ${contacto.Hora}
                        </div>
                        
                        <div class="contacto-acciones">
                            ${contacto.Estado === 'Nuevo' ? `
                                <button class="btn btn-success" onclick="cambiarEstadoContacto('${contacto.Email}', '${contacto.Fecha}', '${contacto.Hora}', 'Leído')">
                                    ✅ Marcar como Leído
                                </button>
                            ` : ''}
                            ${contacto.Estado === 'Leído' ? `
                                <button class="btn btn-warning" onclick="cambiarEstadoContacto('${contacto.Email}', '${contacto.Fecha}', '${contacto.Hora}', 'Respondido')">
                                    📧 Marcar como Respondido
                                </button>
                            ` : ''}
                            <a href="mailto:${contacto.Email}" class="btn">📬 Responder Email</a>
                        </div>
                    </div>
                `;
            });
        }
        
        $('#contactosContainer').html(html);
        
    } catch(err) {
        console.error("❌ Error cargando contactos:", err);
        $('#contactosContainer').html('<p style="color: #dc3545;">❌ Error cargando contactos</p>');
    }
}

async function cambiarEstadoContacto(email, fecha, hora, nuevoEstado) {
    try {
        const res = await fetch('/api/admin/contacto_estado', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: email,
                fecha: fecha,
                hora: hora,
                estado: nuevoEstado
            })
        });
        
        if (res.ok) {
            console.log(`✅ Estado actualizado para ${email}: ${nuevoEstado}`);
            loadContactos(); // Recargar la lista
        } else {
            alert('❌ Error actualizando estado');
        }
    } catch(err) {
        console.error("❌ Error:", err);
        alert('❌ Error actualizando estado');
    }
}

// Inicializar
$(document).ready(function() {
    console.log("🚀 Panel de administración iniciado");
    loadUsuarios();
    loadLogs();
    loadContactos();
    
    // Auto-actualizar cada 30 segundos
    setInterval(loadLogs, 30000);
    setInterval(loadContactos, 45000); // Contactos cada 45 segundos
});
</script>
</body>
</html>
