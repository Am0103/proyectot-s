<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Iniciar sesión | T&amp;S</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/system.css') }}" rel="stylesheet">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card">
            <a class="system-brand text-decoration-none" href="{{ url_for('home') }}">
                <span class="brand-mark">T&amp;S</span>
                <span><strong class="text-dark">Tecnología y Servicios</strong><small class="text-secondary">Plataforma de gestión</small></span>
            </a>
            <h1>Acceso al sistema</h1>
            <p class="text-secondary mb-4">Ingresa con la cuenta asignada por el administrador.</p>
            {% if error %}<div class="login-error mb-3" role="alert">{{ error }}</div>{% endif %}
            <form method="post" action="{{ url_for('sistema_login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label" for="cliente">Cliente</label>
                    <select class="form-select" name="cliente" id="cliente" required>
                        <option value="">Selecciona un cliente</option>
                        {% for cliente in clientes %}<option value="{{ cliente }}">{{ cliente|title }}</option>{% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="usuario">Usuario</label>
                    <input class="form-control" type="text" name="usuario" id="usuario" autocomplete="username" maxlength="40" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="clave">Contraseña</label>
                    <input class="form-control" type="password" name="clave" id="clave" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
            </form>
            <a class="back-link d-inline-block mt-4" href="{{ url_for('home') }}">← Volver al sitio de T&amp;S</a>
        </section>
    </main>
</body>
</html>
