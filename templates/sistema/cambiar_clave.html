<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Cambiar contraseña | T&amp;S</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/system.css') }}" rel="stylesheet">
</head>
<body class="password-page">
    <main class="login-shell">
        <section class="login-card">
            <a class="system-brand text-decoration-none" href="{{ url_for('home') }}">
                <span class="brand-mark">T&amp;S</span>
                <span><strong class="text-dark">Seguridad de la cuenta</strong><small class="text-secondary">Actualización obligatoria</small></span>
            </a>
            <h1>Define una contraseña nueva</h1>
            <p class="text-secondary mb-4">Por seguridad, la contraseña inicial debe cambiarse antes de utilizar el sistema. Usa al menos 12 caracteres.</p>
            {% if error %}<div class="login-error mb-3" role="alert">{{ error }}</div>{% endif %}
            <form method="post" action="{{ url_for('cambiar_clave') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label" for="nueva_clave">Nueva contraseña</label>
                    <input class="form-control" id="nueva_clave" name="nueva_clave" type="password" minlength="12" autocomplete="new-password" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="confirmar_clave">Confirmar contraseña</label>
                    <input class="form-control" id="confirmar_clave" name="confirmar_clave" type="password" minlength="12" autocomplete="new-password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Guardar contraseña</button>
            </form>
            <a class="back-link d-inline-block mt-4" href="{{ url_for('logout') }}">Cerrar sesión</a>
        </section>
    </main>
</body>
</html>
